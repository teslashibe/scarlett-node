[package]
name = "scarlett-prover"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
anyhow = "1"
axum = "0.8"
futures = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
# Only for the fake OpenAI server used in impersonation tests.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
