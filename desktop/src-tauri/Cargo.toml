[package]
name = "scarlett-node-desktop"
version = "0.1.21"
edition = "2024"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "=1.0.151"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-autostart = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
# The web proxy's username and password (src/web_proxy.rs). keyring's v1
# feature picks the native store: macOS Keychain, Windows Credential Manager
# or the Linux Secret Service. keyring-core is the store-neutral entry API the
# app uses with it, and its mock store backs the tests.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# Sleep and wake notifications (src/power.rs). Tauri already depends on these
# exact versions; NSOperation is the only feature they did not enable.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# Testing installers are debug builds. Unoptimized SHA-256 over the bundled
# Claude binary (245 MB on Windows) takes seconds; keep it at release speed.
[profile.dev.package.sha2]
opt-level = 3
