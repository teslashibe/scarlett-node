[package]
name = "scarlett-node-desktop"
version = "0.1.16"
edition = "2024"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "=1.0.151"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-autostart = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"

[dev-dependencies]
tempfile = "3"

# Testing installers are debug builds. Unoptimized SHA-256 over the bundled
# Claude binary (245 MB on Windows) takes seconds; keep it at release speed.
[profile.dev.package.sha2]
opt-level = 3
