openapi: 3.0.3
info:
  title: Scarlett supplier node wire API
  version: node-v2
  description: >-
    Portable proposed supplier/coordinator contract. The coordinator must authenticate bearer
    credentials, atomically fence attempts, validate input and output hashes, and commit signed job IDs
    before issuing leases; these server behaviors are not implemented in this repository. Protocol
    node-v2 (Scarlett Node 0.1.17 and later) is the version string in every body; the routes keep their
    /api/node/v1 prefix. Unknown body fields are rejected. A heartbeat in an older protocol is held for
    its wait_seconds and answered 426 update_required with Scarlett-Node-Update-Required: true
    (api/fixtures/version-headers.json).
servers:
  - url: https://coordinator.example
paths:
  /api/node/v1/pair:
    post:
      summary: Exchange a one-time code for a node-scoped credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, code, profile]
              properties:
                version: {type: string, enum: [node-v2]}
                code: {type: string}
                profile: {type: string}
      responses:
        '200':
          description: Paired; credential is shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairReply'}
  /api/node/v1/heartbeat:
    post:
      security: [{nodeBearer: []}]
      summary: Report availability, acknowledge offers and long-poll for up to eight leases
      description: >-
        The coordinator records the report first, then answers with offers as soon as any
        exist: up to min(8, free slots) leases in one answer. While nothing is offerable it holds
        the request open for up to wait_seconds (clamped to 20, and a full-length hold jittered by
        up to two seconds either way, under its 30-second heartbeat staleness rule) and answers
        the moment a job for this node is funded, or with no leases at the deadline. The node
        heartbeats again immediately after any answer; the hold is its only idle wait. A node
        must bound the request by the longest hold plus a transport grace, never by a short
        fixed timeout: Scarlett Node gives up at 22 + 3 seconds, and pings its HTTP/2 connection
        after 10 seconds without a frame, closing it when no answer comes within 5. The node
        never cuts its own hold short because what it advertised changed: it posts
        /api/node/v1/availability instead, and the coordinator looks for offers for the held
        heartbeat again at once. It ends a hold itself only to leave (a goodbye first) or after
        waking from sleep. offers_seen acknowledges every offer in the answers the node received
        since its previous heartbeat request started, recorded the moment an answer is decoded,
        before the node judges the offer; the coordinator sends again, in this answer, an offer
        it delivered before the previous heartbeat request started that this request does not
        acknowledge. Every offer the node received but will not take is rejected
        (/api/node/v1/jobs/{job_id}/reject), never left to expire. After a failed heartbeat the
        node backs off exponentially from one second, doubling to a 15-second cap with equal
        jitter, and resets after any 200. A Retry-After on a 429 or 503, or on a 200 with no
        leases, makes it wait at least that long (clamped to 1–60 seconds) plus jitter. A
        rejected heartbeat (400 or 413) is logged and backed off; the node never resends it in a
        reduced shape.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Heartbeat'}
      responses:
        '200':
          description: >-
            Offers, possibly none; no implicit acceptance. A coordinator that is shutting down
            answers a held heartbeat at once with no leases and a jittered Retry-After of one to
            five seconds; a goodbye answers the node's held heartbeats at once with no leases.
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeartbeatReply'}
        '400':
          description: Invalid heartbeat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {description: Invalid or revoked node credential}
        '413':
          description: Heartbeat body larger than 32 KiB (heartbeat_too_large)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '426':
          description: >-
            A heartbeat in an older protocol than node-v2 (update_required), answered after the
            hold it asked for, with Scarlett-Node-Update-Required: true. The node keeps
            heartbeating, reports update_required in its status and is offered nothing new.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many node requests (rate_limited)
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Network temporarily unavailable (network_unavailable)
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/node/v1/availability:
    post:
      security: [{nodeBearer: []}]
      summary: Update what the node advertises while its heartbeat is held
      description: >-
        The node's report without the hold or acknowledgements, validated as a heartbeat. The
        coordinator stores state, capacity and services and has the node's held heartbeats look
        for offers again at once (in every API process). It does not count as a heartbeat: it
        moves neither the heartbeat time nor the poll end. The node sends one when what it
        advertised changes during a hold (a worker finishing, an account becoming ready, a drain
        lifted), starting at most one every 250 ms with the newest state; a failed post ends the
        hold instead, so the next heartbeat carries the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Availability'}
      responses:
        '204': {description: Stored; held heartbeats look for offers again}
        '400':
          description: Invalid report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {description: Invalid or revoked node credential}
        '413':
          description: Report larger than 32 KiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many node requests (rate_limited)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/node/v1/goodbye:
    post:
      security: [{nodeBearer: []}]
      summary: Tell the coordinator the node is going away for now
      description: >-
        The coordinator marks the node offline and its poll ended, answers its held heartbeats at
        once with no leases, and hedges or reassigns at once every assignment the node has not
        accepted (none of which counts as a missed offer); accepted work goes on, and the node's
        next heartbeat brings it back. Scarlett Node says goodbye, within one second and best
        effort, before it cancels its held heartbeat: on SIGTERM or Ctrl-C (signal), when its
        owner pipe closes, which is the desktop app's Stop or Quit (stop), when a drain begins
        (update while the desktop updater drains it for an install, else stop) and before the
        machine sleeps (sleep). quit is reserved for a desktop app that tells Quit from Stop.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Goodbye'}
      responses:
        '204': {description: Recorded}
        '400':
          description: Invalid goodbye
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {description: Invalid or revoked node credential}
  /api/node/v1/challenge/echo:
    post:
      security: [{nodeBearer: []}]
      summary: Immediately echo the heartbeat challenge before inference
      description: >-
        No provider call or node-reported time. App starts a monotonic timer when sending the
        challenge in the heartbeat response and stops at authenticated echo receipt. App must
        bind a cryptographically random 32-byte nonce to the authenticated node and credential,
        enforce expiry and atomic single use, and reject cross-node, replayed or unknown nonces.
        No automatic echo retry after an ambiguous response. Use a small rolling median of fresh
        successful samples; expire stale scores and award no bonus without a fresh valid sample.
        RTT includes HTTP handling, not inference, and does not prove co-location or resist relays.
        Disable bonuses unless proxy/relay gaming is acceptable. Local HTTP demos cannot qualify.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChallengeEcho'}
      responses:
        '204': {description: Authenticated single-use echo recorded}
        '401': {description: Invalid or revoked node credential}
        '409': {description: Unknown, expired, replayed or wrong-node nonce}
  /api/node/v1/jobs/{job_id}/accept:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Accept an exact funded offer before provider execution
      description: >-
        Persist the local attempt journal before this request. The coordinator registers the exact
        immutable request with its locally trusted durable verifier and rechecks production funding,
        ownership, revocation and exclusive deadline before committing acceptance. Registration may
        be repeated with identical bindings after uncertainty; provider execution may not be replayed.
        A lost acceptance reply leaves provider work unstarted and requires attempt reconciliation.
        An offer is one assignment of the job: the coordinator may offer the same job to up to
        two more nodes (hedging) and the first acceptance wins; a lost hedge or a superseded
        assignment is answered 409 attempt_conflict, which the node treats as final.
        Acceptance of the exact attempt and fence is idempotent, so on a 503 dispatch_busy or
        network_unavailable, or a 429 rate_limited whose Retry-After is at most 2 seconds, the node
        repeats the same request inside the same acceptance, at most three times, each after the
        Retry-After (clamped to 1–60 seconds, one second when absent) plus jitter, and never later
        than 30 seconds before the lease deadline. It never repeats a 401, 404 or 409, or a 429
        without such a Retry-After. A final 400, 401, 404, 409 or 429 means no lease exists for
        this node, so the node ends the attempt's journal record without reconciling it and sends
        no rejection, unless an earlier try was answered 503 network_unavailable, which may follow
        a committed acceptance. The node refuses, without this request, an offer whose lease
        deadline is more than its service's offer lifetime (plus 5 seconds of clock skew) ahead of
        its own clock: 300 seconds for web and x_read, 120 seconds for codex. A web job's deadline
        is its creation second plus 298 seconds. An x_read search of four to ten pages has the same
        298 seconds; one of one to three pages, and every other read, keeps 118 seconds. An x_read
        offer need not carry its payload, so the node allows every x_read offer the 300 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, attempt, fence, request_sha256, terms_sha256]
              properties:
                version: {type: string, enum: [node-v2]}
                attempt: {type: string}
                fence: {type: string}
                request_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                terms_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Exact durable funded acceptance, with the verifier token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaseAcceptance'}
        '401': {description: Invalid or revoked node credential}
        '404': {description: Attempt unavailable to this node}
        '409': {description: Funding, ownership, terms, fence or deadline conflict}
        '429':
          description: Too many node requests (rate_limited)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: >-
            Verifier unavailable (dispatch_unavailable), bounded registration capacity busy
            (dispatch_busy, with Retry-After) or a transient coordinator failure
            (network_unavailable)
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/node/v1/jobs/{job_id}/reject:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Reject an offer this node will not accept
      description: >-
        For an offer the node received and never sent an acceptance for. The coordinator ends
        that assignment as rejected and hedges or reassigns the job at once; a rejection is not a
        missed offer. Scarlett Node rejects every offer it will not take instead of leaving it to
        expire: one that fails its local offer checks or does not decode (invalid_offer), any
        while it is drained or stopping (draining), one for which no worker slot, or for web no
        web or browser slot, is free (no_slot), one no local account can take (no_account), and
        another attempt of a job it already runs (busy). Best effort: an undelivered rejection
        leaves the job to the coordinator's own timers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Rejection'}
      responses:
        '204': {description: The assignment ended; the job moves on}
        '400':
          description: Invalid rejection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {description: Invalid or revoked node credential}
        '409':
          description: attempt_conflict, the attempt is not this node's open, unaccepted assignment; final
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/node/v1/jobs/{job_id}/result:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Submit the immutable result for an exact live attempt and fence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Result'}
      responses:
        '200': {description: Accepted and committed once}
        '409': {description: Expired, conflicting body or fenced; not rewardable}
  /api/node/v1/jobs/{job_id}/browser-result/parts/{n}:
    put:
      security: [{nodeBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - name: n
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 33}
        - {$ref: '#/components/parameters/BrowserAttempt'}
        - {$ref: '#/components/parameters/BrowserFence'}
        - {$ref: '#/components/parameters/BrowserRequestSHA256'}
        - {$ref: '#/components/parameters/BrowserUploadSHA256'}
        - name: X-Scarlett-Part-SHA256
          in: header
          required: true
          description: SHA-256 of this part's bytes, lowercase hex
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      summary: Upload one part of the browser's rendered DOM for a browser web job
      description: >-
        The DOM the node's browser rendered, as UTF-8 bytes, is compressed with gzip level 6 into
        one stream; that stream is cut into parts of exactly 2097152 bytes except the last
        (1-2097152 bytes), numbered from 1, at most 33 parts (a 64 MiB DOM that does not compress
        still fits). upload_sha256 is the SHA-256 of the whole gzip stream, which is the
        concatenation of the parts in order. Every request is bound to the job's current accepted
        lease on this node (attempt, fence and request digest headers) and is accepted only before
        the lease deadline and before /proven or /fail is committed. The coordinator keeps one
        uncommitted part set per attempt: a PUT whose upload_sha256 differs from the stored set
        replaces it (a node that rebuilt its gzip stream starts over); the same part sent again
        with the same bytes gets 200. After the manifest is committed any PUT gets 409
        result_conflict. The coordinator allows at least 90 seconds to read one part. The node
        holds one part in memory, sends parts in order, and repeats a part or the manifest after
        a transport failure, 429 or 5xx (1, 2, 4 and then every 8 seconds, or the Retry-After
        when longer, each with jitter) for as long as the next try can start and the upload's
        waits stay within 60 seconds in all: a part try only while max(10 s, part size /
        250 kB/s + 5 s) is left before the report deadline, a manifest try while 3 s is.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, minLength: 1, maxLength: 2097152}
      responses:
        '200':
          description: Stored, including an identical replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, enum: [stored]}
        '400': {description: invalid_part (sha256 mismatch, a part other than the last shorter than 2097152 bytes, bad headers)}
        '401': {description: Invalid or revoked node credential}
        '404': {description: Not this node's job}
        '409': {description: result_conflict (manifest already committed), fenced, expired or already_reported}
        '413': {description: Part larger than 2097152 bytes}
        '429': {description: Rate limited}
        '503':
          description: network_unavailable
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
  /api/node/v1/jobs/{job_id}/browser-result/parts:
    get:
      security: [{nodeBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/BrowserAttempt'}
        - {$ref: '#/components/parameters/BrowserFence'}
        - {$ref: '#/components/parameters/BrowserRequestSHA256'}
      summary: List the stored parts of this attempt's browser DOM upload, for resume
      description: >-
        Bound to the accepted lease like the PUT. The node reads it before it sends parts and
        again after a manifest answered 409 parts_incomplete, and skips every part already stored
        with the same upload_sha256 and part sha256.
      responses:
        '200':
          description: The stored set, possibly empty
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserResultParts'}
        '401': {description: Invalid or revoked node credential}
        '404': {description: Not this node's job}
        '409': {description: fenced, expired or already_reported}
        '429': {description: Rate limited}
        '503':
          description: network_unavailable
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
  /api/node/v1/jobs/{job_id}/browser-result:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Commit the browser's result for a browser web job (the manifest)
      description: >-
        One manifest per attempt, for the job's current accepted lease on this node, before
        /proven or /fail is committed and before the lease deadline. Plain JSON of at most
        262144 bytes (no Content-Encoding). For dom ok the coordinator checks that every listed
        part is stored with its sha256, that the SHA-256 of the concatenated parts is
        upload_sha256 and their length gzip_bytes, gunzips them with a 67108864-byte cap, checks
        html_bytes and html_sha256, then commits. For dom too_large (the DOM was larger than
        67108864 bytes; html_bytes is its size and nothing was uploaded) and dom memory (the node
        killed its browser for memory before the DOM existed) it commits the metadata alone, and
        the job is served from the proven re-fetch when that is usable. The same manifest sent
        again gets 200; a different one after commit gets 409 result_conflict. Scarlett did not
        see this page on the wire, so content served from the DOM is labelled not TLS-verified.
        A /proven for a browser job is accepted when this manifest is stored or the verifier
        holds at least one verified hop of the proven re-fetch. The node runs the proven re-fetch
        and this upload at the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrowserResult'}
      responses:
        '200': {description: Stored, including an identical replay}
        '400': {description: invalid_result (fields, or the parts do not hash, gunzip or measure as the manifest says)}
        '401': {description: Invalid or revoked node credential}
        '404': {description: Not this node's job}
        '409': {description: "parts_incomplete (a listed part is missing or differs: read the parts list, send what is missing and post again), result_conflict, fenced, expired or already_reported"}
        '413': {description: Body too large}
        '429': {description: Rate limited}
        '503':
          description: network_unavailable
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
  /api/node/v1/jobs/{job_id}/proven:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Report that a proof was sent to the assigned verifier
      description: >-
        The node does not submit the answer. The coordinator reads Codex model/output/usage, X fulfilment/response copies
        or web hops from the assigned verifier after this call (for a browser web job, also the stored browser-result upload). A supplier copy of the output is not accepted. X bootstrap authentication reads are unproven and do not count as paid exchanges. An empty first search page may fulfil one pinned exchange; missing cursors cannot fulfil later requested pages.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Proven'}
      responses:
        '200': {description: Verifier result accepted and committed once, including an identical report replay}
        '202': {description: Report persisted; verifier ingestion remains pending}
        '409': {description: Expired, conflicting report, fenced or rejected}
  /api/node/v1/jobs/{job_id}/fail:
    post:
      security: [{nodeBearer: []}]
      parameters: [{$ref: '#/components/parameters/JobID'}]
      summary: Report nonrewardable attempt failure
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Failure'}
      responses:
        '200': {description: Failure recorded}
        '409': {description: Expired or fenced}
  /api/node/v1/jobs/{job_id}/attempt:
    get:
      security: [{nodeBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - name: attempt
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: fence
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      summary: Reconcile an authenticated node's exact attempt after interruption
      description: >-
        Only the assigned node may read this outcome. replay_safe true promises
        that result/proven/fail persist one immutable submission body per attempt
        and fence, with identical retries returning the original outcome and changed
        bodies rejected. submission_sha256 hashes the exact HTTP report body bytes.
        Report retries require this explicit contract; the node relies on it to send its
        first report again in place, with the same body, after a 429, a 503
        network_unavailable or a lost answer, for at most 10 seconds. Persistence idempotency
        never authorizes repeated provider execution. live means no committed report;
        proof_pending means the verifier owns ingestion; accepted/failed are committed
        outcomes, with submission_sha256 unless the coordinator decided a relay web
        attempt from the verifier's own record before the node's report arrived (the
        node then treats the attempt as done); expired/fenced are permanent for this attempt. Revocation denies new reports and recovery of unreported attempts. A report committed before unpairing or wallet unbinding may finish verification for the buyer; its node may read only that exact attempt status afterward. Recovery does not authorize another provider call.
        A restarted node reports execution_uncertain for a started attempt and must
        not rerun its provider. That failure must not automatically requeue paid work.
      responses:
        '200':
          description: Durable attempt state, not a payment or points receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptStatus'}
        '401': {description: Invalid or revoked node credential}
        '404': {description: Attempt unavailable to this node or reconciliation unsupported}
components:
  securitySchemes:
    nodeBearer: {type: http, scheme: bearer}
  parameters:
    JobID:
      name: job_id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    BrowserAttempt:
      name: X-Scarlett-Attempt
      in: header
      required: true
      description: The accepted lease's attempt
      schema: {type: string, format: uuid}
    BrowserFence:
      name: X-Scarlett-Fence
      in: header
      required: true
      description: The accepted lease's fence
      schema: {type: string, format: uuid}
    BrowserRequestSHA256:
      name: X-Scarlett-Request-SHA256
      in: header
      required: true
      description: The accepted lease's request_sha256
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    BrowserUploadSHA256:
      name: X-Scarlett-Upload-SHA256
      in: header
      required: true
      description: SHA-256 of the whole gzip stream (all parts concatenated), lowercase hex
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
  headers:
    RetryAfter:
      description: >-
        Seconds to wait before calling again, or an HTTP date. The node clamps it to [1, 60]
        seconds and adds up to half of it again as jitter, so nodes told the same wait do not
        return together.
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, description: "Stable machine code, such as rate_limited, heartbeat_too_large, dispatch_busy or network_unavailable"}
            message: {type: string, description: Human-readable text; nodes must not parse it}
    PairReply:
      type: object
      required: [version, node_id, supplier_pubkey, credential]
      properties:
        version: {type: string, enum: [node-v2]}
        node_id: {type: string}
        supplier_pubkey: {type: string}
        credential: {type: string}
    Heartbeat:
      type: object
      required: [version, node_id, profile, state, wait_seconds, offers_seen]
      description: Legacy nodes share catalog capacity. Services-mode nodes report independently enabled Codex, X and web capacities and states; all health is node-reported, not verifier acceptance or payment evidence.
      properties:
        version: {type: string, enum: [node-v2]}
        node_id: {type: string}
        profile: {type: string}
        state: {type: string, enum: [available, exhausted], description: exhausted means the node's gateway recently had no capacity; the coordinator offers it no lease until it reports available again.}
        wait_seconds: {type: integer, minimum: 0, maximum: 20, description: "How long the coordinator may hold this heartbeat open while it has nothing to offer. The node sends 20; the coordinator clamps the value to [0, 20] and answers early the moment an offer exists. Zero asks for an immediate answer."}
        bid: {type: integer, minimum: 0, maximum: 1000000000, description: Standing assignment bid. Lower wins, then least assigned work, then node_id. Missing is treated as 100. Not an on-chain quote.}
        capacity: {type: integer, minimum: 0, maximum: 96, description: "Legacy typed reports use the exact sum of service capacities. Enriched readiness reports use the shared physical ceiling: the sum of configured_capacity where present and ordinary capacity otherwise. Generic runnable capacity may be zero while an exact operation is runnable. Legacy untyped reports require positive capacity; omitted legacy capacity defaults to 1. Physical capacity alone never grants operation readiness."}
        services:
          type: array
          maxItems: 3
          description: Each kind (codex, x_read, web) is unique; disabled kinds report not_added with zero capacity and in-flight count
          items: {$ref: '#/components/schemas/ServiceHealth'}
        offers_seen:
          type: array
          maxItems: 64
          uniqueItems: true
          description: >-
            Required, and empty when there is nothing to acknowledge. Every offer in the answers
            the node received since its previous heartbeat request started, each once, recorded
            the moment an answer is decoded and before the node judges the offer (an offer it
            rejects or cannot decode included). A heartbeat that is not answered 200 hands its
            acknowledgements to the next one.
          items: {$ref: '#/components/schemas/OfferRef'}
    OfferRef:
      type: object
      additionalProperties: false
      required: [job_id, attempt]
      properties:
        job_id: {type: string, format: uuid, description: Canonical non-nil UUID}
        attempt: {type: string, format: uuid, description: "The offered assignment's attempt: canonical non-nil UUID"}
    HeartbeatReply:
      type: object
      required: [leases, node]
      properties:
        leases:
          type: array
          maxItems: 8
          description: Up to min(8, free slots) offers. The node rejects each one it will not take.
          items: {$ref: '#/components/schemas/Lease'}
        node: {$ref: '#/components/schemas/NodeHealth'}
        challenge: {$ref: '#/components/schemas/Challenge'}
    NodeHealth:
      type: object
      additionalProperties: false
      required: [missed_streak, suspect_until]
      description: >-
        The coordinator's dispatch health for this node. missed_streak counts offers in a row
        that the node neither accepted nor acknowledged within three seconds; a rejection, a lost
        hedge or a goodbye is no miss, and any acceptance resets it. While suspect_until is
        ahead (30 seconds doubling with each miss, at most ten minutes), the coordinator sends
        the node no realtime work and at most one background job. Scarlett Node shows both in
        status.json (dispatch_health).
      properties:
        missed_streak: {type: integer, minimum: 0, maximum: 32767}
        suspect_until: {type: string, format: date-time, nullable: true}
    Availability:
      type: object
      additionalProperties: false
      required: [version, node_id, profile, state, bid, capacity]
      description: The heartbeat's report without wait_seconds or offers_seen, validated as a heartbeat.
      properties:
        version: {type: string, enum: [node-v2]}
        node_id: {type: string}
        profile: {type: string}
        state: {type: string, enum: [available, exhausted]}
        bid: {type: integer, minimum: 0, maximum: 1000000000}
        capacity: {type: integer, minimum: 0, maximum: 96}
        services:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/ServiceHealth'}
    Goodbye:
      type: object
      additionalProperties: false
      required: [version, node_id, reason]
      properties:
        version: {type: string, enum: [node-v2]}
        node_id: {type: string, description: Must match the authenticated credential owner.}
        reason: {type: string, enum: [stop, quit, signal, update, sleep]}
    Rejection:
      type: object
      additionalProperties: false
      required: [version, attempt, fence, reason]
      properties:
        version: {type: string, enum: [node-v2]}
        attempt: {type: string, format: uuid}
        fence: {type: string, format: uuid}
        reason: {type: string, enum: [invalid_offer, draining, no_slot, no_account, busy, other]}
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [kind, state, capacity, in_flight]
      properties:
        kind: {type: string, enum: [codex, x_read, web]}
        state: {type: string, enum: [not_added, configured, ready, exhausted, auth_required, unreachable], description: "configured means a local credential file is usable (for x_read: the account's warm client is still being built, or a rest just ended and the next 15-second check has not yet confirmed the installed client); ready means local execution reported proof sent, not verifier acceptance, or for x_read that a client build validated the session against X; an x_read build that X refuses, rate-limits or cannot reach reports auth_required, exhausted or unreachable without waiting for a job. web has no accounts: configured means enabled with the proof helper present, ready means the last web job ended proven, and unreachable carries last_error_code relay_misuse (keyed relay halted), prover_error (helper missing) or web_proxy_failed (a rest after the egress proxy failed: 60 seconds when it was unreachable or answered 429, 10 minutes after 407, 30 minutes after 402; a 403 or an exit failure rests nothing). Target-side web failures, and the browser codes web_browser_unavailable and web_browser_failed, never change the web state; browser readiness is reported in browser."}
        capacity: {type: integer, minimum: 0, maximum: 32}
        in_flight: {type: integer, minimum: 0, maximum: 32}
        configured_capacity: {type: integer, minimum: 0, maximum: 32, description: "Optional physical service ceiling including retained in-flight work and distinct usable authenticated account lanes, at least capacity. Never provider quota or global independence across nodes."}
        runnable_capacity: {type: integer, minimum: 0, maximum: 32, description: "Optional free slots eligible across every supported operation; capacity equals in_flight plus runnable_capacity. Per-operation slots overlap this inventory and are never added together."}
        active_accounts: {type: integer, minimum: 0, maximum: 32, description: "Canonical verified usable nonremoved local identities, including busy and quota-resting identities. Account counts are present together; removed draining work remains only in occupancy."}
        ready_accounts: {type: integer, minimum: 0, maximum: 32, description: "Active identities with a free lane eligible for at least one supported operation. Not a count of provider requests."}
        cooling_accounts: {type: integer, minimum: 0, maximum: 32, description: "Active identities with a free lane and a known future wait for every supported operation. ready_accounts plus cooling_accounts is at most active_accounts."}
        next_ready_at: {type: string, format: date-time, description: "Optional UTC deadline for the earliest known cooling account, no more than 30 days ahead. Transit may make this overdue. Advisory only: a fresh report and final local check grant readiness."}
        operation_availability:
          type: array
          maxItems: 4
          description: >-
            Optional X readiness for unique fixed operations. Entries share physical identity
            lanes and are never summed. Each free count is at most configured_capacity minus
            in_flight. Configured/ready service capacity may be zero when an operation has free
            capacity; node available requires actual generic or exact-operation free capacity.
            Drain, rest and unavailable recovery journals zero every operation's free count.
            Omitted entries fall back to generic readiness, never guessed provider budgets.
          items:
            type: object
            additionalProperties: false
            required: [operation, runnable_capacity]
            properties:
              operation: {type: string, enum: [search, profile, post, thread]}
              runnable_capacity: {type: integer, minimum: 0, maximum: 32}
              next_ready_at: {type: string, format: date-time, description: "Optional bounded UTC eligibility hint; elapsed time alone does not authorize an offer."}
        last_error_code: {type: string, description: Bounded failure code only, never raw provider errors or credentials}
        max_input_bytes: {type: integer, minimum: 1, maximum: 65536, description: Local Codex prompt UTF-8 bytes, serialized x_request UTF-8 bytes or serialized web_request UTF-8 bytes; omitted by legacy nodes and disabled kinds}
        max_output_tokens: {type: integer, minimum: 1, maximum: 8192, description: Codex local output reservation limit; absent for X}
        models:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Codex base models accepted locally; absent for X and legacy nodes, never proof of subscription access
          items: {type: string, enum: [gpt-6.1-sol, gpt-6-astra, gpt-6-sol, gpt-6-luna, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5]}
        active_leases:
          type: array
          maxItems: 32
          description: >-
            Optional coordinator leases currently occupying this service. At most in_flight
            references, with unique job IDs across services. The coordinator subtracts only
            references matching live leases for this node, service, attempt and fence.
            Unknown, terminal or absent references stay conservatively additive.
          items: {$ref: '#/components/schemas/ActiveLease'}
        proof_modes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: >-
            x_read only. Proof modes the operator lets this node serve. Absent means mpc only,
            which is all a node without the field serves. A coordinator must not send a relay
            job to a node that does not list relay, and should omit proof_mode on mpc jobs so
            nodes that predate the field still accept them.
          items: {type: string, enum: [mpc, relay]}
        egress:
          type: string
          enum: [direct, both, proxy]
          description: "web only; required for an enabled web entry. direct means every page leaves from the node's own network. both means its own network by default and the operator's HTTP CONNECT proxy for leases with web_egress proxy (the desktop app's Sites that limit this network, or a proxy file with use limited_sites). proxy means every page goes through the proxy (use all). Node-reported, not verified."
        browser:
          $ref: '#/components/schemas/BrowserHealth'
    BrowserHealth:
      type: object
      additionalProperties: false
      required: [state, capacity, in_flight]
      description: >-
        web only; required on an enabled web entry and forbidden elsewhere. Readiness of the
        node's hidden browser for web jobs in browser mode. ready means the bundled runtime and
        the pinned Chrome for Testing were verified and a launch probe passed, not that a browser
        is running. Browser capacity sits inside web capacity: a browser lease also counts in the
        web entry's in_flight, and capacity is never more than the web capacity.
      properties:
        state: {type: string, enum: [ready, unavailable]}
        reason:
          type: string
          enum: [disabled, web_unavailable, memory_low, disk_low, runtime_missing, runtime_invalid, browser_downloading, browser_download_failed, browser_invalid, deps_missing, sandbox_unavailable, helper_failed]
          description: >-
            Required exactly when unavailable. disabled: SCARLETT_WEB_BROWSER=off (the Windows
            default in this release). web_unavailable: web is not configured or ready, or keyed
            relay is halted. memory_low: under 8 GiB of physical RAM. disk_low: not enough free disk
            to extract, download or start. runtime_missing / runtime_invalid: the bundled runtime
            archive is absent or failed verification. browser_downloading / browser_download_failed
            / browser_invalid: the pinned browser download is in progress, failed (retrying with
            backoff) or failed verification. deps_missing: Linux shared libraries are missing.
            sandbox_unavailable: Linux unprivileged user namespaces are blocked; the browser never
            runs unsandboxed. helper_failed: three helper start failures within 10 minutes.
        capacity: {type: integer, minimum: 0, maximum: 4, description: "1-4 when ready, 0 when unavailable"}
        in_flight: {type: integer, minimum: 0, maximum: 4, description: At most capacity}
        version: {type: string, maxLength: 64, description: Chrome for Testing version; present exactly when ready}
        kill_bytes:
          type: integer
          minimum: 1
          description: >-
            Present exactly when ready. The browser process tree size, in bytes, above which this
            node kills its browser: max(recycle + 1.5 GiB, physical memory / 4), where recycle is
            1.25 GiB + 0.75 GiB × capacity. Above recycle (or at macOS memory pressure warn above
            recycle) the browser only drains: the pages in flight finish, then it restarts. While a
            page is in flight, macOS memory pressure critical also kills it. A killed page is
            reported in the browser-result manifest as dom memory with tree_peak_bytes; the
            coordinator may send the job again to a node whose kill_bytes is at least 1.5 ×
            tree_peak_bytes.
        solvers:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [capmonster, capsolver, 2captcha]}
          description: >-
            Optional, ready only. The captcha-solver providers the node operator configured
            (SCARLETT_WEB_SOLVERS) and may use now: absent without a configuration and once the
            operator's daily spend cap is reached. Names only; the operator pays the providers and
            their keys never leave the node except to them.
    ActiveLease:
      type: object
      additionalProperties: false
      required: [job_id, attempt, fence]
      properties:
        job_id: {type: string, format: uuid, description: Canonical non-nil UUID}
        attempt: {type: string, format: uuid, description: Canonical non-nil UUID}
        fence: {type: string, format: uuid, description: Canonical non-nil UUID}
    Challenge:
      type: object
      required: [version, nonce, expires_at]
      properties:
        version: {type: string, enum: [node-v2]}
        nonce: {type: string, pattern: '^[0-9a-f]{64}$', description: App-generated random 32-byte nonce; never supplied by a job.}
        expires_at: {type: string, format: date-time, description: App-enforced freshness deadline; node rejects locally expired challenges.}
    ChallengeEcho:
      type: object
      required: [version, node_id, nonce]
      additionalProperties: false
      properties:
        version: {type: string, enum: [node-v2]}
        node_id: {type: string, description: Must match the authenticated credential owner.}
        nonce: {type: string, pattern: '^[0-9a-f]{64}$'}
    LeaseAcceptance:
      type: object
      additionalProperties: false
      required: [version, state, funding_authority, lease]
      properties:
        version: {type: string, enum: [node-v2]}
        state: {type: string, enum: [leased]}
        funding_authority: {type: string, enum: [production_receipt], description: Normalized trusted payment-adapter evidence; never prototype funds}
        lease: {$ref: '#/components/schemas/Lease'}
    Lease:
      type: object
      description: >-
        Job ID and signed_job_id are issued/committed server-side before lease; client does not
        cryptographically verify signed_job_id yet. codex_payload, x_payload and web_payload carry the
        exact verifier request of a Codex, x_read or web job; verifier_token arrives only in the funded
        acceptance reply. The node proves that request to the locally configured verifier; the
        coordinator reads the answer from the verifier, not from this node. A web lease fetches one
        public https page: the node resolves the host itself, refuses private and reserved addresses,
        and opens the connection from its own address while the verifier is the TLS client. A web
        lease in browser mode first renders the page in the node's hidden browser, uploads that copy
        (browser-result), and re-fetches the page through the same verified relay with the browser's
        User-Agent and anti-bot clearance cookies.
      required: [version, job_id, signed_job_id, profile, input_sha256, attempt, fence, lease_deadline, settlement_deadline]
      oneOf:
        - required: [model_id, prompt, max_input_tokens, max_output_tokens]
          properties:
            service_type: {type: string, enum: [codex]}
            model_id: {type: string, minLength: 1}
            max_input_tokens: {type: integer, minimum: 1}
            max_output_tokens: {type: integer, minimum: 1}
        - required: [service_type, x_request, x_payload]
          properties:
            service_type: {type: string, enum: [x_read]}
            model_id: {type: string, maxLength: 0}
            prompt: {type: string, maxLength: 0}
            max_input_tokens: {type: integer, maximum: 0}
            max_output_tokens: {type: integer, maximum: 0}
        - required: [service_type, web_request, web_payload]
          properties:
            service_type: {type: string, enum: [web]}
            model_id: {type: string, maxLength: 0}
            prompt: {type: string, maxLength: 0}
            max_input_tokens: {type: integer, maximum: 0}
            max_output_tokens: {type: integer, maximum: 0}
      properties:
        version: {type: string, enum: [node-v2]}
        acceptance_required: {type: boolean, description: Required true for community provider work; token-free offers need funded acceptance before execution}
        request_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Canonical exact verifier request digest}
        job_id: {type: string}
        signed_job_id: {type: string, description: Legacy commitment field; community offers bind the immutable reviewed terms digest, not an on-chain signature.}
        service_type: {type: string, enum: [codex, x_read, web], description: Required in services mode; omitted by legacy Codex leases}
        profile: {type: string}
        model_id: {type: string, description: 'A catalog base model or its gateway alias with a reasoning effort (-low, -medium, -high, -xhigh, -max) and/or the fast tier (-fast, -fast-<effort>). Proven Codex leases must name a base model.'}
        prompt: {type: string}
        max_input_tokens: {type: integer, minimum: 0}
        max_output_tokens: {type: integer, minimum: 0}
        input_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        attempt: {type: string}
        fence: {type: string}
        lease_deadline: {type: string, format: date-time}
        settlement_deadline: {type: string, format: date-time}
        codex_payload:
          type: object
          description: Exact Codex response.create the node must send. Required with verifier_token for proven jobs.
        verifier_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Single-use token for the verifier configured in SCARLETT_VERIFIER. Not a login secret.
        x_request: {$ref: '#/components/schemas/XRequest'}
        x_payload: {$ref: '#/components/schemas/XPayload'}
        web_request: {$ref: '#/components/schemas/WebRequest'}
        web_payload: {$ref: '#/components/schemas/WebPayload'}
        web_prewarm_browser:
          type: boolean
          description: >-
            Relay web offers only, forbidden on browser offers and other services. The page's domain
            has met bot protection before, so the node starts its browser while it runs the relay job
            in case the coordinator escalates. Outside web_request: never hashed into input_sha256
            and not part of the accepted terms.
        web_egress:
          type: string
          enum: [proxy]
          description: >-
            Web offers only, relay or browser. The page's domain recently limited a node's own network,
            so the node sends this job through its proxy with a session of its own. Sent only to nodes
            whose web egress is both or proxy; a node whose egress is direct rejects the offer
            invalid_offer. A node never falls back to its own network when the proxy fails. Outside
            web_request like web_prewarm_browser: never hashed and not part of the accepted terms; the
            acceptance reply repeats it.
    XRequest:
      type: object
      additionalProperties: false
      required: [operation]
      description: search uses a trimmed query, 1-20 items per page and 1-10 exact pages, Latest order (nodes before 0.1.16 accept at most 3, and the coordinator sends more only to 0.1.16 or later); profile uses username; post/thread use post_id and one exchange; unrelated fields must be absent or zero
      properties:
        operation: {type: string, enum: [search, profile, post, thread]}
        query: {type: string, minLength: 1, maxLength: 256}
        username: {type: string, pattern: '^[A-Za-z0-9_]{1,15}$'}
        post_id: {type: string, pattern: '^[0-9]{1,20}$'}
        count: {type: integer, minimum: 1, maximum: 20}
        pages: {type: integer, minimum: 1, maximum: 10}
    XPayload:
      type: object
      additionalProperties: false
      required: [type, exchanges, max_attempts]
      description: Exact verifier x.read policy, with one attempt per requested exchange, no automatic retries, unique JSON keys and integer numbers; pagination uses the same operation/variables and cursor_from immediately preceding it
      properties:
        type: {type: string, enum: [x.read]}
        max_attempts: {type: integer, minimum: 1, maximum: 10}
        proof_mode:
          type: string
          enum: [mpc, relay]
          description: >-
            How each read is proven. Absent or mpc is MPC-TLS. relay makes the verifier the TLS
            client through the node's connection, so the node holds no session key and adds only
            its session cookie and CSRF values; a node serves it unless its operator opted out
            with SCARLETT_X_RELAY=0 (relay is on by default), and only with proof_policy x-relay-v1.
            A relay node trusts its verifier with its session; see the repository README.
        proof_policy:
          type: string
          enum: [x-relay-v1]
          description: Required with proof_mode relay and forbidden otherwise.
        exchanges:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [operation, query_id, variables, features]
            properties:
              operation: {type: string, enum: [SearchTimeline, UserByScreenName, TweetResultByRestId, TweetDetail]}
              query_id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
              variables: {type: object}
              features: {type: object}
              field_toggles: {type: object}
              cursor_from: {type: integer, minimum: 0, maximum: 1}
    WebRequest:
      type: object
      additionalProperties: false
      required: [operation, url]
      description: >-
        One public https page. url is canonical per api/web-vectors.json (lowercase host, port 443
        only, no userinfo, IP literal, fragment, reserved name or x.com/twitter.com host).
        input_sha256 is the SHA-256 of this object serialized by Go encoding/json, so it also
        binds mode and the browser options. mode is absent for a relay job; browser is present
        exactly when mode is browser, which requires web_payload proof_policy web-browser-v1.
      properties:
        operation: {type: string, enum: [scrape]}
        url: {type: string, maxLength: 2048, pattern: '^https://'}
        mode: {type: string, enum: [browser]}
        browser: {$ref: '#/components/schemas/WebBrowser'}
    WebBrowser:
      type: object
      additionalProperties: false
      required: [wait, wait_ms, timeout_ms, block_resources, solve_challenge]
      description: The browser phase of a browser web job.
      properties:
        wait: {type: string, enum: [load, networkidle], description: "networkidle waits for load, then up to 3 seconds more for the network to go quiet"}
        wait_ms: {type: integer, minimum: 0, maximum: 15000, description: Extra settle time}
        wait_selector: {type: string, minLength: 1, maxLength: 256, pattern: '^[\x20-\x7E]+$', description: "CSS selector waited for (attached) inside the budget; one that never appears does not fail the fetch"}
        timeout_ms: {type: integer, minimum: 5000, maximum: 45000, description: Budget for the browser phase}
        block_resources: {type: boolean}
        solve_challenge: {type: boolean, description: Run the built-in Cloudflare solver on a Cloudflare interstitial}
    WebPayload:
      type: object
      additionalProperties: false
      required: [type, proof_mode, proof_policy, url, max_redirects, max_response_bytes, headers]
      description: >-
        Exact verifier web.fetch policy with unique JSON keys and integer numbers. The verifier is
        the TLS client through the node's connection; each redirect hop is a new session under the
        same token, authorized only for the canonical https Location of the previous verified 3xx.
        The node never receives page plaintext. Unknown fields are refused. web-relay-v1 has no
        node_headers. web-browser-v1 (browser mode) has exactly the headers accept and
        accept-language with their default values, in that order, node_headers exactly
        [user-agent, cookie] and max_redirects 5; the node supplies the browser's pinned
        User-Agent and, optionally, a Cookie of anti-bot clearance cookies only, which the
        verifier checks against the same pins and allowlist (api/web-vectors.json).
        max_response_bytes is the page ceiling (64 MiB) for both policies: the final hop's entity
        bytes (de-chunked, still content-encoded); the verifier counts chunk framing and heads
        apart. A larger page fails the hop as page_too_large. Each hop (one relay-web session)
        runs at most 280 seconds (relay-web timeout_ms 1000-280000), and never past the lease
        deadline less the node's 10-second report margin. A verifier at its web session limit
        answers verifier_busy (relay-web class verifier_busy) and closes; the node retries the hop 1, 2, 4
        and then every 5 seconds while at least 1 second of that budget would remain.
      properties:
        type: {type: string, enum: [web.fetch]}
        proof_mode: {type: string, enum: [relay]}
        proof_policy: {type: string, enum: [web-relay-v1, web-browser-v1]}
        url: {type: string, maxLength: 2048, pattern: '^https://', description: Equal to web_request.url}
        max_redirects: {type: integer, minimum: 0, maximum: 5}
        max_response_bytes: {type: integer, enum: [67108864], description: The page ceiling; must equal 67108864}
        headers:
          type: array
          maxItems: 3
          description: Allowlisted request headers, each at most once, in the order user-agent, accept, accept-language
          items:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
              name: {type: string, enum: [user-agent, accept, accept-language]}
              value: {type: string, minLength: 1, maxLength: 512}
        node_headers:
          type: array
          minItems: 2
          maxItems: 2
          description: web-browser-v1 only, exactly [user-agent, cookie]
          items: {type: string, enum: [user-agent, cookie]}
    BrowserResult:
      type: object
      additionalProperties: false
      required: [version, attempt, fence, request_sha256, url, final_url, status_code, headers, set_cookie_names, content_type, dom, html_bytes, gzip_bytes, parts, challenge, redirects, browser, started_at_ms, duration_ms]
      description: >-
        The browser-result manifest: what the node's browser rendered, without the DOM itself,
        which travels as gzip parts (browser-result/parts). Plain JSON, integers only and no
        unknown fields. attempt, fence and request_sha256 must equal the job's current accepted
        lease for this node, and url its web_request.url. Cookie values never appear;
        set_cookie_names carries names only. With dom memory the browser was killed before the
        page finished, so final_url and content_type are empty, status_code is 0, headers,
        set_cookie_names and redirects are empty and challenge is none.
      properties:
        version: {type: string, enum: [node-v2]}
        attempt: {type: string, format: uuid}
        fence: {type: string, format: uuid}
        request_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        url: {type: string, maxLength: 2048}
        final_url: {type: string, maxLength: 2048, description: "Absolute http or https URL of the last main-frame document; never an x.com or twitter.com host. Empty exactly with dom memory."}
        status_code: {type: integer, minimum: 0, maximum: 999, description: "100-999; 0 exactly with dom memory"}
        headers:
          type: array
          maxItems: 128
          description: "Last main-frame document's response headers as [name, value] pairs: lowercase token names of at most 64 bytes, printable ASCII values of at most 4096 bytes, at most 65536 bytes in total, never set-cookie or cookie"
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: string}
        set_cookie_names: {type: array, maxItems: 50, items: {type: string}}
        content_type: {type: string}
        dom:
          type: string
          enum: [ok, too_large, memory]
          description: >-
            ok: the DOM (the rendered document for an HTML page, else empty) was uploaded in
            parts, never cut. too_large: the DOM was larger than 67108864 UTF-8 bytes; html_bytes
            is its size and no part was sent. memory: the node killed its browser for memory
            while the page was loading (see BrowserHealth.kill_bytes); tree_peak_bytes is
            required.
        html_bytes: {type: integer, minimum: 0, description: "UTF-8 length of the DOM: 0-67108864 with dom ok, above 67108864 with dom too_large, 0 with dom memory"}
        html_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the DOM's UTF-8 bytes; present exactly with dom ok}
        gzip_bytes: {type: integer, minimum: 0, maximum: 69206016, description: "Length of the gzip stream (sum of the parts): at least 1 with dom ok, else 0"}
        upload_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the gzip stream (the concatenated parts); present exactly with dom ok. The coordinator stores it as the result's upload_sha256 and the signed browser proof carries it.}
        parts:
          type: array
          maxItems: 33
          description: "The sha256 of each part in order, ceil(gzip_bytes / 2097152) entries with dom ok, else empty"
          items: {type: string, pattern: '^[0-9a-f]{64}$'}
        tree_peak_bytes: {type: integer, minimum: 1, description: "The largest browser process tree size the node sampled while this page loaded; required with dom memory, optional otherwise"}
        challenge: {type: string, enum: [none, solved, unsolved]}
        redirects:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [url, status_code]
            properties:
              url: {type: string, maxLength: 2048}
              status_code: {type: integer, minimum: 100, maximum: 999}
        browser:
          type: object
          additionalProperties: false
          required: [engine, version, user_agent]
          properties:
            engine: {type: string, enum: [scrapling/0.4.15+scarlett.2], description: "Scrapling 0.4.15 plus the anti-bot handlers, from teslashibe/Scrapling release v0.4.15-scarlett.2"}
            version: {type: string, description: Chrome for Testing version}
            user_agent: {type: string, description: The pinned User-Agent the browser sent}
        started_at_ms: {type: integer, minimum: 0, description: "Unix milliseconds when the browser phase started; the coordinator accepts accepted_at - 5000 to received_at"}
        duration_ms: {type: integer, minimum: 0}
        solver:
          type: string
          enum: [used, needed]
          description: >-
            Optional. used: the node operator's own captcha solver cleared a captcha on this page.
            needed: the page stopped at a captcha that takes a solver (none configured, none allowed
            under the operator's daily cap, or the solver failed). Absent otherwise. The coordinator
            remembers the page's domain and offers its browser jobs to nodes that report solvers
            first.
    BrowserResultParts:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        upload_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: The stored set's upload sha256; absent when no part is stored}
        parts:
          type: array
          maxItems: 33
          description: The stored parts in order of n
          items:
            type: object
            additionalProperties: false
            required: [n, sha256]
            properties:
              n: {type: integer, minimum: 1, maximum: 33}
              sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    Result:
      type: object
      description: >-
        Paid mode requires usage_source upstream. unpaid_local_demo is a local fixture marker.
        The current app may record it as simulated Scarlett SCT and must not treat that as an
        on-chain mint. Source is forwarded from the gateway, not authenticated provider evidence.
        duration_ms is never reward latency.
      required: [version, job_id, attempt, fence, input_sha256, output_sha256, output, resolved_model_id, input_tokens, output_tokens, duration_ms, usage_available, usage_source, execution_mode]
      properties:
        version: {type: string, enum: [node-v2]}
        job_id: {type: string}
        attempt: {type: string}
        fence: {type: string}
        input_sha256: {type: string}
        output_sha256: {type: string}
        output: {type: string}
        resolved_model_id: {type: string, description: The lease model or, for an alias, its base model.}
        input_tokens: {type: integer, minimum: 1}
        cached_input_tokens: {type: integer, minimum: 0, description: Cached subset of input_tokens as reported by the gateway. Omitted when not reported; never inferred.}
        output_tokens: {type: integer, minimum: 1}
        duration_ms: {type: integer, minimum: 0, description: Node-observed gateway request duration; diagnostic only, never reward latency.}
        usage_available: {type: boolean, enum: [true]}
        usage_source: {type: string, enum: [upstream, unknown], description: Only upstream can qualify in paid mode; missing or other gateway sources normalize to unknown in unpaid demos.}
        execution_mode: {type: string, enum: [paid, unpaid_local_demo], description: Paid mode requires upstream usage. unpaid_local_demo may be recorded only as simulated Scarlett SCT.}
    Proven:
      type: object
      description: Proof was sent. The coordinator reads the answer from the verifier.
      required: [version, attempt, fence]
      additionalProperties: false
      properties:
        version: {type: string, enum: [node-v2]}
        attempt: {type: string}
        fence: {type: string}
        egress: {$ref: '#/components/schemas/WebEgress'}
    WebEgress:
      type: object
      description: >-
        Required in every proven and fail report of a web job, and forbidden in reports of other
        services. via is how the job left the node: direct (its own network) or proxy. exit is the
        proxy's public IPv4 address as the node's probe through the job's session saw it
        (https://ipv4.webshare.io/), present only for a proxied job whose probe answered in time;
        a direct report never carries an address. The coordinator keys web cooldowns by it.
        Node-reported, not verified.
      required: [via]
      additionalProperties: false
      properties:
        via: {type: string, enum: [direct, proxy]}
        exit: {type: string, format: ipv4}
    AttemptStatus:
      type: object
      additionalProperties: false
      required: [version, job_id, attempt, fence, state, replay_safe]
      properties:
        version: {type: string, enum: [node-v2]}
        job_id: {type: string}
        attempt: {type: string}
        fence: {type: string}
        state: {type: string, enum: [live, proof_pending, accepted, failed, expired, fenced]}
        replay_safe: {type: boolean, enum: [true]}
        submission_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Hash of the exact report bytes the coordinator committed, for accepted/failed attempts decided by a node report; absent when the verifier''s own record decided a relay web attempt first'}
    Failure:
      type: object
      required: [version, attempt, fence, code]
      properties:
        version: {type: string, enum: [node-v2]}
        attempt: {type: string}
        fence: {type: string}
        code: {type: string, enum: [invalid_lease, expired, gateway_error, capacity_unavailable, invalid_gateway_response, usage_unavailable, usage_untrusted, usage_out_of_bounds, prover_error, execution_uncertain, auth_required, service_unavailable, x_rate_limited, x_incomplete, x_request_failed, relay_misuse, web_egress_denied, web_dns_failed, web_connect_failed, web_proxy_failed, web_proxy_refused, web_fetch_failed, web_browser_unavailable, web_browser_failed, page_too_large], description: relay_misuse means the node caught its verifier sealing something other than the node's own request in a keyed-relay session, or closing the session without opening the record; the node then stops serving relay until its operator clears the halt. execution_uncertain means a provider call might have occurred before interruption and must not automatically requeue paid work. Transport failure alone does not prove a call never ran; capacity_unavailable must not authorize an ambiguous provider retry. Web codes describe the first hop only (a later hop failing after a verified first hop is reported proven); web_egress_denied means the page host resolved to a private, reserved or local address, or its URL failed node validation; web_dns_failed means the host did not resolve within 5 seconds; web_connect_failed means the node could not open TCP to the checked address, before any verifier session, or for a proxied job that the proxy's exit could not (CONNECT answered 502 or another status not named here; the node first retries hop 0 once on a fresh session); web_proxy_failed means the egress proxy was unreachable or did not speak CONNECT, refused the sign-in (407), was out of bandwidth (402) or busy (429); web_proxy_refused means the proxy answered the CONNECT 403, refusing that target; web_fetch_failed means the verified session failed after the token was presented (TLS, framing, a verifier refusal, or a verifier that stayed busy for the whole hop budget). page_too_large means the page is over the 64 MiB ceiling: stage wire when the first hop's verifier refused the entity as too large (relay-web class page_too_large), stage dom when a browser job's DOM was larger than 67108864 bytes and neither its manifest was stored nor a re-fetch hop verified; stage and observed_bytes are present exactly with it, and observed_bytes is a lower bound (the coordinator prefers the verifier's own byte counts). For browser web jobs, web_browser_unavailable means the browser tier was not ready or its helper could not start, and web_browser_failed means the browser failed (navigation, TLS, crash, timeout or a memory kill) with no browser copy stored and no verified re-fetch hop; neither changes the web state.}
        stage: {type: string, enum: [wire, dom], description: page_too_large only}
        observed_bytes: {type: integer, minimum: 67108865, description: "page_too_large only: at least this many bytes (wire: 67108865 when the node has no count; dom: the DOM's UTF-8 size)"}
        egress: {$ref: '#/components/schemas/WebEgress'}
