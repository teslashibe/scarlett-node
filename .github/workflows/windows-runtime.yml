name: windows-runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Real provider acceptance and installer signing remain separate gates.
      # Native synthetic tests never contain provider credentials or live jobs.
      - run: go build ./...
      - run: go build -o "$env:RUNNER_TEMP/scarlett-node.exe" .
      - run: go vet ./...
      - run: go test -race ./...
        env:
          SCARLETT_TEST_NODE_BINARY: ${{ runner.temp }}/scarlett-node.exe
      - run: rustup toolchain install
        working-directory: prover
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prover
      - run: cargo test --locked
        working-directory: prover
      # The web browser tier on Windows: the x-login Node it reuses, the
      # packaged Python runtime, then a live run against loopback fixtures
      # with the Windows assertions (no visible window, Job membership,
      # nothing under the real LOCALAPPDATA\Google).
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - run: node scripts/prepare-x-login-runtime.mjs win32-x64 "$env:RUNNER_TEMP/rt/x-login-runtime"
      - run: node scripts/prepare-web-runtime.mjs win32-x64 "$env:RUNNER_TEMP/rt" "$env:RUNNER_TEMP/rt/x-login-runtime"
      - run: go test -tags webbrowser_live -count=1 -v ./internal/webruntime -run TestLive
        env:
          SCARLETT_TEST_WEB_RUNTIME: ${{ runner.temp }}/rt
