name: windows-runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Real provider acceptance and installer signing remain separate gates.
      # Native synthetic tests never contain provider credentials or live jobs.
      - run: go build ./...
      - run: go build -o "$env:RUNNER_TEMP/scarlett-node.exe" .
      - run: go vet ./...
      - run: go test -race ./...
        env:
          SCARLETT_TEST_NODE_BINARY: ${{ runner.temp }}/scarlett-node.exe
      - run: rustup toolchain install
        working-directory: prover
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prover
      - run: cargo test --locked
        working-directory: prover
