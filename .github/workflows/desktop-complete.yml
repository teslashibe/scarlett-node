name: desktop complete bundle
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.cargo/**'
      - '**.go'
      - 'go.*'
      - 'prover/**'
      - 'third_party/**'
      - '.github/workflows/desktop-complete.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: 'Optional completed same-runtime build to rerun only installed Windows acceptance'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-complete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.installer_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Windows dependency inspection
        run: python -m unittest discover -s desktop/scripts -p 'test_windows_pe_imports.py'
      - name: Parse installed Windows acceptance script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'desktop/scripts/check-windows-install.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'Installed Windows acceptance script did not parse' }
      - name: Compile native Windows acceptance input
        if: runner.os == 'Windows'
        shell: powershell
        run: '& desktop/scripts/check-windows-input.ps1'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.95 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: |
            prover
            desktop/src-tauri
      - name: Native node checks
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Build reviewed components and prepare the complete native runtime
        # The release workflow runs this same script, so tested and signed
        # bundles are assembled by one copy of these commands.
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: desktop/scripts/build-complete-runtime.sh "$NATIVE_PLATFORM" "$RUNNER_TEMP/scarlett-runtime"
      - name: Validate native Windows proof runtime fixtures
        if: runner.os == 'Windows'
        run: cargo +1.95 test --locked --manifest-path prover/Cargo.toml
      - name: Validate Windows signatures, including an ephemeral self-signed certificate
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($scriptName in @('check-windows-signatures.ps1', 'test-windows-signatures.ps1', 'sign-windows-file.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE "desktop/scripts/$scriptName"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw 'Windows signature acceptance script did not parse' }
          }
          & desktop/scripts/test-windows-signatures.ps1 -UnsignedNativeBinary "$env:RUNNER_TEMP/scarlett-runtime/scarlett-node.exe"
      - name: Validate Windows signed-bundle provenance contracts
        run: python -m unittest discover -s desktop/scripts -p 'test_windows_bundle_signing.py'
      - name: Validate owner closure drains accepted synthetic node work
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          SCARLETT_TEST_NODE_BINARY="$RUNNER_TEMP/scarlett-runtime/scarlett-node$suffix" go test -race . -run '^TestActualDesktopOwnerDrainFinishesAcceptedWorkAndSurvivesRestart$' -count=1
      - name: Release signing, identity, assembly and version pin contract tests
        if: runner.os == 'macOS'
        run: |
          for suite in test_macos_signing.py test_signing_identities.py test_release_manifest.py test_version_pins.py test_release_workflow.py; do
            python3 -m unittest discover -s desktop/scripts -p "$suite"
          done
      - name: Desktop tests and native checks
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          npm --prefix desktop ci --ignore-scripts
          npm --prefix desktop test
          npm --prefix desktop run build
          # Windows Codex login profiles are created only by the built node
          # helper. Its profile tests require it there; macOS cross-checks it.
          SCARLETT_TEST_NODE_BINARY="$RUNNER_TEMP/scarlett-runtime/scarlett-node$suffix" cargo +1.95 test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo +1.95 clippy --locked --all-targets --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
      - name: Validate native desktop API supervision without account login
        env:
          SCARLETT_NATIVE_RESOURCE_TEST: ${{ github.workspace }}/desktop/src-tauri/runtime
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export SCARLETT_NATIVE_API_TEST="$RUNNER_TEMP/scarlett-runtime/open-agent-api$suffix"
          cargo +1.95 test --locked --manifest-path desktop/src-tauri/Cargo.toml local_api::tests::native_api_supervisor_uses_disposable_profiles_and_stops -- --ignored
      - name: Build installer for testing
        id: installer
        working-directory: desktop
        run: npm run tauri build -- --debug --config src-tauri/tauri.complete.generated.json
      - name: Validate native packaged components and protected local API
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            app="$GITHUB_WORKSPACE/desktop/src-tauri/target/debug/bundle/macos/Scarlett Node.app/Contents"
            python3 desktop/scripts/check-complete-bundle.py "$app/MacOS" "$app/Resources"
          else
            # The NSIS installer is built, but this check uses the same payload
            # directory. Installed Windows UI/private-storage acceptance is a
            # separate release gate and is never inferred from this check.
            python desktop/scripts/check-complete-bundle.py \
              "$GITHUB_WORKSPACE/desktop/src-tauri/target/debug" \
              "$GITHUB_WORKSPACE/desktop/src-tauri/target/debug"
          fi
      - name: Rehearse self-signed Mac release signing and launch, without secrets
        # A throwaway certificate in a temporary keychain drives the real
        # self-signed-stable signer over a copy of this complete app. Its
        # evidence is marked as a rehearsal and can never be published.
        if: runner.os == 'macOS'
        run: |
          desktop/scripts/rehearse-macos-signing.sh \
            "$GITHUB_WORKSPACE/desktop/src-tauri/target/debug/bundle/macos/Scarlett Node.app" \
            "$RUNNER_TEMP/scarlett-mac-rehearsal"
          desktop/scripts/smoke-macos-dmg.sh "$RUNNER_TEMP/scarlett-mac-rehearsal/Scarlett-Node-rehearsal.dmg" \
            "$RUNNER_TEMP/scarlett-mac-smoke"
      - name: Prepare isolated Windows browser stores
        if: runner.os == 'Windows'
        run: python desktop/scripts/prepare-browser-fixtures.py "$RUNNER_TEMP/scarlett-browser-fixtures"
      - name: Build the Windows installation-only upgrade variant
        if: runner.os == 'Windows'
        working-directory: desktop
        run: |
          node scripts/prepare-upgrade-fixture.mjs "$RUNNER_TEMP/scarlett-upgrade-installers"
          npm run tauri build -- --debug --config src-tauri/tauri.upgrade-testing.generated.json
      - name: Validate installed Windows desktop, preferences and browser import without login
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: powershell
        run: |
          $fixturePath = "$env:RUNNER_TEMP/scarlett-upgrade-installers/fixture.json"
          $fixture = [System.IO.File]::ReadAllText($fixturePath) | ConvertFrom-Json
          $upgrades = @(Get-ChildItem -LiteralPath desktop/src-tauri/target/debug/bundle/nsis -Filter ("*_" + $fixture.upgradeVersion + "_*.exe"))
          if ($upgrades.Count -ne 1) { throw 'Expected one versioned upgrade testing installer' }
          & desktop/scripts/check-windows-install.ps1 -Installer $fixture.baselineInstaller -EvidenceDirectory "$env:RUNNER_TEMP/scarlett-installed-evidence" -Preferences -BrowserFixture "$env:RUNNER_TEMP/scarlett-browser-fixtures/fixture.json" -UpgradeFixture $fixturePath -UpgradeInstaller $upgrades[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.installer.conclusion == 'success' }}
        with:
          name: desktop-testing-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/debug/bundle/dmg/*.dmg
            desktop/src-tauri/target/debug/bundle/nsis/*.exe
            desktop/src-tauri/runtime/COMPONENTS.json
            ${{ runner.temp }}/scarlett-installed-evidence/*.json
          if-no-files-found: error
  windows_ui_recheck:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_run_id != '' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the same reviewed runtime source
        shell: bash
        env:
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['INSTALLER_RUN_ID']
          assert re.fullmatch('[0-9]+', run_id), 'Numeric native build run required'
          repo = os.environ['GITHUB_REPOSITORY']
          build = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run_id], text=True))
          assert build['head_repository']['full_name'] == repo and build['status'] == 'completed'
          assert build['path'] == '.github/workflows/desktop-complete.yml'
          source = build['head_sha']
          assert re.fullmatch('[a-f0-9]{40}', source)
          jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/runs/' + run_id + '/jobs'], text=True))['jobs']
          native = [job for job in jobs if 'win32-x64' in job['name']]
          assert len(native) == 1 and any(step['name'] == 'Build installer for testing' and step['conclusion'] == 'success' for step in native[0]['steps'])
          changed = subprocess.check_output(['git', 'diff', '--name-only', source, 'HEAD'], text=True).splitlines()
          allowed = {'desktop/scripts/check-windows-install.ps1', 'desktop/scripts/check-windows-input.ps1', '.github/workflows/desktop-complete.yml', 'desktop/README.md'}
          assert set(changed) <= allowed, 'Runtime or packaging source changed; run the complete native build'
          evidence = {'installerBuildRun': int(run_id), 'installerBuildSource': source, 'acceptanceSource': os.environ['GITHUB_SHA'], 'changedFiles': changed, 'runtimeSourceUnchanged': True, 'providerJobs': 0}
          directory = Path(os.environ['RUNNER_TEMP']) / 'scarlett-recheck-source'
          directory.mkdir()
          (directory / 'source.json').write_text(json.dumps(evidence, indent=2))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-testing-win32-x64
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scarlett-recheck-package
      - name: Compile native Windows acceptance input
        shell: powershell
        run: '& desktop/scripts/check-windows-input.ps1'
      - name: Parse and test the installed Windows app
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'desktop/scripts/check-windows-install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Installed acceptance script did not parse' }
          python desktop/scripts/prepare-browser-fixtures.py "$env:RUNNER_TEMP/scarlett-browser-fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic browser fixture setup failed' }
          $installers = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/scarlett-recheck-package" -Filter '*.exe' -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one previously built native installer' }
          & desktop/scripts/check-windows-install.ps1 -Installer $installers[0].FullName -EvidenceDirectory "$env:RUNNER_TEMP/scarlett-installed-evidence" -Preferences -BrowserFixture "$env:RUNNER_TEMP/scarlett-browser-fixtures/fixture.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-windows-ui-recheck
          path: |
            ${{ runner.temp }}/scarlett-recheck-source/*.json
            ${{ runner.temp }}/scarlett-installed-evidence/*.json
          if-no-files-found: error
