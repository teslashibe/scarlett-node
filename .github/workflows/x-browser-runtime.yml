name: X browser runtime fixtures
on:
  pull_request:
    paths:
      - 'third_party/social-login/**'
      - 'third_party/x-go/**'
      - 'x_login*.go'
      - 'x_browser_contract_test.go'
      - 'scripts/*x-login*'
      - 'scripts/verify-social-login.mjs'
      - 'internal/xloginruntime/**'
      - 'packaging/x-login*'
      - 'internal/webruntime/**'
      - 'third_party/web-browser/**'
      - 'scripts/*web-runtime*'
      - 'scripts/pin-chrome-for-testing.mjs'
      - '.github/workflows/x-browser-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: third_party/social-login/package-lock.json
      - run: node scripts/verify-social-login.mjs
      - run: npm ci --ignore-scripts
        working-directory: third_party/social-login
      # Browser download occurs only in explicit offline fixture preparation.
      - run: npx playwright install --with-deps chromium
        working-directory: third_party/social-login
      - run: npm run check && npm test
        working-directory: third_party/social-login
      - run: node --test scripts/verify-x-login-runtime.test.mjs scripts/verify-social-login.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/xloginruntime
      - name: Go to browser-service contract
        run: SCARLETT_TEST_X_LOGIN_NODE="$(command -v node)" go test -race -run TestBrowserLoginRuntimeContract -count=1 .
      - run: node --test scripts/verify-web-runtime.test.mjs scripts/pin-chrome-for-testing.test.mjs
      # The web browser runtime exactly as the headless bundle ships it: the
      # x-login Node it reuses, then the hash-locked Python runtime archive.
      - run: node scripts/prepare-x-login-runtime.mjs linux-x64 "$RUNNER_TEMP/rt/x-login-runtime"
      - run: node scripts/prepare-web-runtime.mjs linux-x64 "$RUNNER_TEMP/rt" "$RUNNER_TEMP/rt/x-login-runtime"
      - name: Web browser helper tests with the packaged Python
        run: |
          mkdir "$RUNNER_TEMP/web-python"
          tar -xzf "$RUNNER_TEMP/rt/web-runtime-linux-amd64.tar.gz" -C "$RUNNER_TEMP/web-python"
          "$RUNNER_TEMP/web-python/python/bin/python3.13" -B -m unittest discover -s third_party/web-browser -p 'test_*.py'
      # Chrome for Testing's sandbox needs unprivileged user namespaces, which
      # Ubuntu 24.04's AppArmor restricts by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Live browser tier against loopback fixtures
        run: SCARLETT_TEST_WEB_RUNTIME="$RUNNER_TEMP/rt" go test -tags webbrowser_live -count=1 -v ./internal/webruntime -run TestLive
